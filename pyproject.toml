[project]
name = "trader-mcp"
version = "0.0.0"
description = "Terminal-first, AI-native crypto trading platform delivered as a Model Context Protocol (MCP) server."
readme = "README.md"
# Runtime/distribution target is Python 3.12 (PRD §4; see .python-version). The
# floor is 3.11 only so CI can also guard 3.11 per PRD §6 Phase 0.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simon Lacey", email = "simon@dashboardhosting.com" }]
keywords = ["mcp", "trading", "crypto", "ccxt", "backtesting", "bybit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Pinned to MCP SDK 1.x (locked decision, PRD §4: SDK v2 churn risk).
# All FastMCP usage is isolated behind trader_mcp.server._sdk.
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.urls]
Homepage = "https://github.com/mysleekdesigns/trader-mcp"
Repository = "https://github.com/mysleekdesigns/trader-mcp"

[project.scripts]
trader-mcp = "trader_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.380",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader_mcp"]

# ─────────────────────────────────────────────────────────────
# Ruff — lint + format
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# .claude/ holds the team's Claude Code tooling (agents/skills/hooks), not product
# code. The hooks are stdlib-only Python 3 scripts owned by the repo config, not
# this package, so keep them out of the package lint/format scope.
extend-exclude = [".claude", "cache", "jobs", "snapshots", "webhooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",  # function call in default arg (FastMCP / typer-style patterns)
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, magic values, and longer fixtures freely.
"tests/**/*.py" = ["S101", "PLR2004", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["trader_mcp"]

[tool.ruff.format]
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# Pyright — type checking (src layout)
# ─────────────────────────────────────────────────────────────
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# ─────────────────────────────────────────────────────────────
# Mypy — alternative type checker (uv run mypy src)
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
packages = ["trader_mcp"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# Pytest + coverage
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["trader_mcp"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
